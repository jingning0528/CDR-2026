# TransformerDTCDR model configuration
train_batch_size: 4096
embedding_size: 64
learning_rate: 0.0005
mlp_hidden_size: [64, 64]
dropout_prob: 0.3
alpha: 0.7
base_model: NeuMF

# embedding_size must be divisible by transformer_num_heads.
transformer_num_heads: 4
transformer_num_layers: 1
transformer_dim_feedforward: 256
transformer_dropout: 0.3

# Optional interaction-level DP preprocessing for source training data only.
source_dp_enabled: true
dp_epsilon: 5.0
dp_delta: 1e-5
dp_projection_dim: 256
dp_projection_density: 0.1
dp_clip_norm: 1.0
dp_output_topk: 200
dp_noise_multiplier: 1.0
dp_seed: 2022
