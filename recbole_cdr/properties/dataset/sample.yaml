# book-crossing_librarything
seed: 2022
field_separator: "\t"
item_link_file_path: recbole_cdr/dataset_example/Book-Crossing_Librarything.link
source_domain:
  dataset: Book-Crossing
  data_path: recbole_cdr/dataset_example
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: ISBN
  RATING_FIELD: rating
  TIME_FIELD: timestamp
  NEG_PREFIX: neg_
  LABEL_FIELD: label
  load_col:
    inter: [user_id, ISBN, rating]
  user_inter_num_interval: "[5,inf)"
  item_inter_num_interval: "[0,inf)"
  val_interval:
    rating: "[5,inf)"
  drop_filter_field: True

target_domain:
  dataset: Librarything
  data_path: recbole_cdr/dataset_example
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: book_name
  RATING_FIELD: rating
  TIME_FIELD: timestamp
  NEG_PREFIX: neg_
  LABEL_FIELD: label
  load_col:
    inter: [user_id, book_name, rating]
  user_inter_num_interval: "[5,inf)"
  item_inter_num_interval: "[5,inf)"
  val_interval:
    rating: "[5,inf)"
  drop_filter_field: True
# training and evaluation
train_epochs: ["BOTH:300"]
train_batch_size: 512
eval_batch_size: 4096
valid_metric: NDCG@10
