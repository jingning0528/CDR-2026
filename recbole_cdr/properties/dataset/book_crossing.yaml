# Book-Crossing benchmark: Book-Crossing (source) -> Librarything (target)
seed: 2022
field_separator: "\t"
user_link_file_path: ~
item_link_file_path: Book-Crossing_Librarything.link

source_domain:
  dataset: Book-Crossing
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: ISBN
  RATING_FIELD: rating
  TIME_FIELD: timestamp
  NEG_PREFIX: neg_
  LABEL_FIELD: label
  load_col:
    inter: [user_id, ISBN, rating]
  user_inter_num_interval: "[5,inf)"
  item_inter_num_interval: "[0,inf)"
  val_interval:
    rating: "[5,inf)"
  drop_filter_field: True

target_domain:
  dataset: Librarything
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: book_name
  RATING_FIELD: rating
  TIME_FIELD: timestamp
  NEG_PREFIX: neg_
  LABEL_FIELD: label
  load_col:
    inter: [user_id, book_name, rating]
  user_inter_num_interval: "[5,inf)"
  item_inter_num_interval: "[5,inf)"
  val_interval:
    rating: "[5,inf)"
  drop_filter_field: True
